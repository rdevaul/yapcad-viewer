name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Browser workbench / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - if: matrix.node == '24'
        # Scoped to runtime dependencies. braces, micromatch and fast-glob
        # carry advisories against every published version, reached only
        # through dev tooling (@next/eslint-plugin-next, vinext), so an
        # unscoped gate cannot be satisfied by upgrading and blocks every PR.
        # Dev-tooling advisories need periodic review, not a merge gate.
        run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
